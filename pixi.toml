[workspace]
name = "thermal_acclimation_in_ecosystem_respiration"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]
version = "0.1.0"

# ---------------------------------------------------------------- default env
# R + Stan for workflow steps 01-04, plus the Python used by the download
# scripts. Anything not on conda-forge is installed by `r-dependencies`.

[dependencies]
r-base = ">=4.4"
# Stan
cmdstan = "*"
r-cmdstanr = "*"
r-brms = "*"
# Workflow packages (steps 01-04)
r-bayesplot = "*"
r-boot = "*"
r-car = "*"
r-caret = "*"
r-corrplot = "*"
r-dplyr = "*"
r-fbasics = "*"
r-ggplot2 = "*"
r-ggpubr = "*"
r-lme4 = "*"
r-lubridate = "*"
r-mblm = "*"
r-mumin = "*"
r-nlme = "*"
r-performance = "*"
r-randomforest = "*"
r-ranger = "*"
r-rsample = "*"
# R/sun-times.R calls suncalc's internal .getTimes(); keep the version fixed.
r-suncalc = "==0.5.3"
r-terra = "*"
r-tidyr = "*"
r-tidyverse = "*"
r-vip = "*"
r-vsurf = "*"
r-zoo = "*"
# Kept only for Demo_code_data_for_1site/, which is left as published.
r-librarian = "*"
# Build-time needs of the CRAN/GitHub packages in scripts/install-r-deps.R
# (gslnls links GSL).
gsl = "*"
r-remotes = "*"
# Imports of plotbiomes (GitHub-only; Whittaker biome polygons for the website)
r-mapview = "*"
r-sp = "*"
"r-data.table" = "*"
# Pipeline, I/O and tests
r-arrow = "*"
r-digest = "*"
r-optparse = "*"
r-targets = "*"
r-tarchetypes = "*"
r-crew = "*"
"r-crew.cluster" = "*"
r-qs2 = "*"
r-testthat = "*"
r-rcpptoml = "*"
# Python for scripts/*.py
python = ">=3.12,<3.14"
pandas = "*"
requests = "*"

[tasks]
r-dependencies = { cmd = "Rscript scripts/install-r-deps.R", description = "Install R packages that are not on conda-forge" }
check-deps = { cmd = "Rscript scripts/check-deps.R", description = "Load every R package the workflow needs" }
targets = { cmd = "Rscript -e 'targets::tar_make()'", description = "Run the targets pipeline (steps 01-02); see _targets.R" }

# ---------------------------------------------------------------- website env
# Kept separate so the analysis environment stays lean.

[feature.website.dependencies]
python = ">=3.12,<3.14"
pandas = "*"
pyarrow = "*"
caddy = "*"

[feature.website.tasks]
website-build = { cmd = "python analysis-website/build.py", default-environment = "website", description = "Build the analysis website's data files" }
website-serve = { cmd = "caddy run --config analysis-website/Caddyfile --adapter caddyfile", default-environment = "website", description = "Serve the analysis website on 127.0.0.1" }

# --------------------------------------------------------------- download env
# The data update's downloads (refactor-v2 stage S18): flux releases
# (scripts/download-flux-update.R, R/download-flux.R) and ERA5-Land soil
# water (scripts/download-era5-swc.py). amerifluxr is installed from GitHub
# by `download-r-deps`.

[feature.download.dependencies]
python = ">=3.12,<3.14"
pandas = "*"
requests = "*"
xarray = "*"
zarr = "*"
dask = "*"
fsspec = "*"
aiohttp = "*"
r-base = ">=4.4"
r-rcpptoml = "*"
r-remotes = "*"
# amerifluxr's imports, so that installing it compiles nothing
r-heatmaply = "*"
r-httr = "*"
r-jsonlite = "*"
r-memoise = "*"
r-rcurl = "*"
r-readxl = "*"

[feature.download.pypi-dependencies]
fluxnet-shuttle = { git = "https://github.com/fluxnet/shuttle.git" }
icoscp-core = ">=0.3.13,<0.4"
terndata-flux = ">=1.0.7"

[feature.download.tasks]
download-r-deps = { cmd = "Rscript -e 'if (!requireNamespace(\"amerifluxr\", quietly = TRUE)) remotes::install_github(\"chuhousen/amerifluxr\", upgrade = \"never\")'", default-environment = "download", description = "Install amerifluxr (GitHub)" }

[environments]
website = { features = ["website"], no-default-feature = true }
download = { features = ["download"], no-default-feature = true }

# R's read.csv only strips the UTF-8 byte-order mark that starts
# data/site_info.csv (and string sorting matches the authors' setup) in a
# UTF-8 locale; shells without LANG would otherwise give R the C locale.
[activation.env]
LANG = "en_US.UTF-8"
LC_ALL = "en_US.UTF-8"
