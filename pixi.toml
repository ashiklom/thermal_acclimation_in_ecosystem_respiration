[workspace]
authors = ["Alexey Shiklomanov <alexey.shiklomanov@gmail.com>"]
channels = ["conda-forge"]
name = "thermal_acclimation_in_ecosystem_respiration"
platforms = ["linux-64", "osx-arm64"] # missing win-64
version = "0.1.0"

[tasks]
deps = {
  cmd = ["Rscript", "dependencies.R"],
  description = "Install additional R package dependencies."
}

targets = {
  cmd = ["Rscript", "-e", "'targets::tar_make()'"],
  description = "Run targets::tar_make()"
}

download_aanet = {
  description = "Download the AmeriFlux BADM/BIF site metadata table",
  cmd = ["Rscript", "-e", "targets::tar_source(); download_ameriflux_bif()"]
}

download_era5 = {
  description = "Download ERA5 SWC data",
  cmd = ["./scripts/download-era5-swc.py"]
}

test = {
  description = "Run unit tests for the data-preparation layer",
  cmd = ["Rscript", "tests/run-tests.R"]
}

reconcile = {
  description = "Reconcile step-01 outputs against the original manuscript outputs",
  cmd = ["Rscript", "tests/reconcile-step01.R"]
}

ts-baseline = {
  description = "Check the TS/SWC column refactor against its frozen step-02 oracle",
  cmd = ["Rscript", "tests/ts-swc-baseline.R"]
}

check-updates = {
  description = "Check whether providers have newer flux data than data-raw/ holds",
  cmd = ["uv", "run", "scripts/check-data-updates.py"]
}

download-icos = {
  description = "Download ICOS ETC L2 or Warm Winter 2020 archives (--product/--sites)",
  cmd = ["uv", "run", "scripts/download-icos.py"]
}

audit-coverage = {
  description = "Report per-site record coverage against the manuscript's year counts",
  cmd = ["Rscript", "scripts/audit-icos-coverage.R"]
}

[dependencies]
r-bayesplot = ">=1.15.0,<2"
r-boot = ">=1.3_32,<2"
r-brms = ">=2.23.0,<3"
r-car = ">=3.1_5,<4"
r-caret = ">=7.0_1,<8"
r-cmdstanr = ">=0.9.0,<0.10"
r-corrplot = ">=0.95,<0.96"
r-dplyr = ">=1.2.1,<2"
r-fbasics = ">=4052.98,<4053"
r-ggplot2 = ">=4.0.3,<5"
r-ggpubr = ">=1.0.0,<2"
r-librarian = ">=1.8.1,<2"
r-lme4 = ">=2.0_6,<3"
r-lubridate = ">=1.9.5,<2"
r-maps = ">=3.4.3,<4"
r-mblm = ">=0.12.1,<0.13"
r-mumin = ">=1.48.19,<2"
r-nlme = ">=3.1_170,<4"
r-optparse = ">=1.8.2,<2"
r-performance = ">=0.18.2,<0.19"
r-randomforest = ">=4.7_1.2,<5"
r-ranger = ">=0.18.0,<0.19"
r-remotes = ">=2.5.0,<3"
r-rsample = ">=1.3.2,<2"
r-s7 = ">=0.2.2,<0.3"
r-sf = ">=1.1_2,<2"
r-suncalc = ">=0.5.3,<0.6"
r-terra = ">=1.9_34,<2"
r-tidyr = ">=1.3.2,<2"
r-tidyverse = ">=2.0.0,<3"
r-vip = ">=0.4.6,<0.5"
r-vsurf = ">=1.2.1,<2"
r-zoo = ">=1.8_15,<2"
# Targets dependencies
r-base64url = "*"
r-igraph = "*"
# languageserver
r-collections = "*"
r-lintr = "*"
r-roxygen2 = "*"
r-styler = "*"
r-xmlparsedata = "*"
# Python dependencies
ipython = ">=9.17.1,<10"
python = ">=3.12,<3.14"
uv = ">=0.12.12,<0.13"
unzip = ">=6.0,<7"
r-qs2 = ">=0.2.1,<0.3"
r-crew = ">=1.3.3,<2"
r-targets = ">=1.12.0,<2"
r-tarchetypes = ">=0.14.1,<0.15"
"r-crew.cluster" = ">=0.4.0,<0.5"
r-testthat = ">=3.3.1,<4"

[pypi-dependencies]
fluxnet-shuttle = { git = "https://github.com/fluxnet/shuttle.git" }

# Issues with MacOS SDK 27.0
[activation]
env = {
  SDKROOT = "/Library/Developer/CommandLineTools/SDKs/MacOSX26.5.sdk",
  KMP_DUPLICATE_LIB_OK = "TRUE"
}
